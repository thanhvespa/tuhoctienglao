services:
  - type: web
    name: tu-hoc-tieng-lao
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: python3 tools/build_web_dist.py
    startCommand: node Web-Server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: LICENSE_SECRET
        generateValue: true
      # Admin API (/api/admin/*, /api/bot/leads, drip & reminder triggers).
      # Without it those routes are disabled (fail closed).
      - key: ADMIN_TOKEN
        generateValue: true
      # Pass the same value as secret_token when calling Telegram setWebhook.
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Zalo OA webhook signature verification (from the Zalo developer console).
      - key: ZALO_APP_ID
        sync: false
      - key: ZALO_OA_SECRET_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://tuhoctienglao.online
