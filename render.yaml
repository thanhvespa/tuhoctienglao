services:
  - type: web
    name: tu-hoc-tieng-lao
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: python3 tools/build_web_dist.py
    startCommand: node Web-Server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: LICENSE_SECRET
        generateValue: true
